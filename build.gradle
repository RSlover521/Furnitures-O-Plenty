plugins {
    id 'architectury-plugin' version '3.4.151'
    id 'dev.architectury.loom' version '1.7.435' apply false
}

architectury {
    minecraft = minecraft_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.officialMojangMappings()
    }
}

group = mod_group_id
version = mod_version

subprojects {
    apply plugin: 'java'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    group = rootProject.mod_group_id
    version = rootProject.mod_version

    base {
        archivesName = rootProject.mod_id
    }

    repositories {
        maven { url 'https://maven.architectury.dev/' }
        maven { url 'https://maven.fabricmc.net/' }
        maven { url 'https://maven.minecraftforge.net/' }
        maven {
            url 'https://cursemaven.com'
            content { includeGroup 'curse.maven' }
        }
        maven {
            url 'https://api.modrinth.com/maven'
            content { includeGroup 'maven.modrinth' }
        }
        mavenLocal()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 17
    }

    java {
        withSourcesJar()
    }
}

tasks.register('build') {
    group = 'build'
    description = 'Builds the common, Forge, and Fabric modules.'
    dependsOn ':common:build', ':forge:build', ':fabric:build'
}
